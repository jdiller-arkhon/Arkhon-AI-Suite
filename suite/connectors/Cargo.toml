[package]
name = "arkhon-connectors"
description = "Connectors to customers' apps (IMAP/SMTP mail first). Sending always needs an engine-issued approval."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arkhon-engine = { path = "../engine" }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3.31"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
tokio = { version = "1.54.1", features = ["net", "io-util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "1.0.4"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
