[package]
name = "arkhon-engine"
description = "Suite engine: organization, connections, activity log and persistence behind one command API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arkhon-org = { path = "../../crates/arkhon-org", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
aes-gcm = { version = "0.10.3", features = ["std"] }
zeroize = { version = "1.8.1", features = ["std"] }

[dev-dependencies]
tempfile = "3.23.0"
