[package]
name = "arkhon-suite-dev"
description = "Local development server: serves the suite prototype and the engine's command API on 127.0.0.1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arkhon-engine = { path = "../engine" }
axum = "0.8.9"
futures-core = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "io-util", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.23.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
