[package]
name = "arkhon-crypto"
description = "Chunked AES-256-GCM model encryption, canonical encoding and release signing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "rand_core", "zeroize", "fast"] }
hkdf = "=0.12.4"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"
zeroize = { version = "=1.9.1", features = ["derive"] }

# Held at 0.14.7: 0.14.8+ deprecates `from_slice`, used throughout RustCrypto 0.10-era APIs,
# which would fail `clippy -D warnings`. Lift when moving to the RustCrypto 0.11 releases.
generic-array = "=0.14.7"

[dev-dependencies]
proptest = "=1.12.0"
rand_chacha = "=0.3.1"
