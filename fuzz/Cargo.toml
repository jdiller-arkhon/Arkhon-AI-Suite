[package]
name = "arkhon-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
description = "cargo-fuzz targets for every Arkhon parser (run with nightly: `cargo +nightly fuzz run <target>`)."

[package.metadata]
cargo-fuzz = true

[dependencies]
arkhon-crypto = { path = "../crates/arkhon-crypto" }
arkhon-license = { path = "../crates/arkhon-license" }
libfuzzer-sys = "=0.4.10"

# Kept out of the main workspace: needs nightly and libFuzzer.
[workspace]
members = ["."]

[[bin]]
name = "license_decode"
path = "fuzz_targets/license_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cert_decode"
path = "fuzz_targets/cert_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "revocation_decode"
path = "fuzz_targets/revocation_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "renewal_decode"
path = "fuzz_targets/renewal_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_header"
path = "fuzz_targets/model_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_decrypt"
path = "fuzz_targets/model_decrypt.rs"
test = false
doc = false
bench = false
