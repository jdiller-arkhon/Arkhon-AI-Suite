[project]
name = "arkhon-tools"
version = "0.0.1"
description = "Arkhon Python tooling: env check, model registry validation, data/eval pipelines"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607"]  # subprocess on fixed, trusted system tools in env-check

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tools", "models"]
