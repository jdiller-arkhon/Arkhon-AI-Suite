[workspace]
resolver = "2"
members = [
  "crates/arkhon-license",
  "crates/arkhon-tpm",
  "crates/arkhon-crypto",
  "runtime",
  "suite/engine",
  "server",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Arkhon-Proprietary"
publish = false
repository = "https://github.com/jdiller-arkhon/Arkhon-AI-Suite"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
