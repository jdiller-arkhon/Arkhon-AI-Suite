name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: arkhon, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arkhon" --health-interval 5s --health-retries 10
    env:
      ARKHON_TEST_DATABASE_URL: postgresql://arkhon@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with: {components: "rustfmt, clippy"}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: sudo apt-get update && sudo apt-get install -y libtss2-dev swtpm
      - run: cargo test --workspace
      - name: TPM tests against swtpm
        run: |
          mkdir -p /tmp/swtpm
          swtpm socket --tpmstate dir=/tmp/swtpm --tpm2 --server type=tcp,port=2321 --ctrl type=tcp,port=2322 --flags not-need-init,startup-clear --daemon
          ARKHON_TEST_TCTI="swtpm:host=127.0.0.1,port=2321" cargo test -p arkhon-tpm --features tpm -- --nocapture
          ARKHON_TEST_TCTI="swtpm:host=127.0.0.1,port=2321" cargo test -p arkhon-runtime --features tpm -- --nocapture
  rust-windows-macos:
    # The runtime ships to Windows and macOS customers: build and test the whole workspace there.
    # Linux-only code (memload/launch, the Phase 1 binaries, TPM via tss-esapi) is cfg-gated.
    #
    # Postgres: the license server's DB tests skip without ARKHON_TEST_DATABASE_URL but assert
    # when CI is set (GitHub always sets it). Service containers only run on Linux runners, so
    # instead of installing Postgres on two OSes we build the server here (`cargo build
    # --workspace`) and leave its DB tests to the Linux `rust` job, which runs them against a
    # real Postgres. Nothing in the server is OS-specific; the runtime, crates and suite run their
    # full test suites on both OSes.
    strategy:
      fail-fast: false
      matrix: {os: [windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --exclude arkhon-license-server
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "pyyaml>=6" "jsonschema>=4.20" "pytest>=8" "ruff>=0.12"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
  env-check-matrix:
    # The env-check tool must run on every customer OS.
    strategy:
      matrix: {os: [ubuntu-latest, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m arkhon_envcheck.check
        working-directory: tools/env-check
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .
