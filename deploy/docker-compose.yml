# Local / staging deployment of the Arkhon License Manager.
#   1. Create keys OFFLINE with tools/keygen (root) and put the issuing key, cert and a CEK KEK in ./secrets/
#      (git-ignored):  secrets/issuing.key  secrets/issuing.cert  secrets/cek-kek.hex
#   2. export ARKHON_ROOT_PUBLIC_KEY=<hex from `arkhon-keygen root`>  POSTGRES_PASSWORD=<strong>
#   3. docker compose -f deploy/docker-compose.yml up -d
#   4. docker compose -f deploy/docker-compose.yml run --rm license-server create-admin --email you@arkhonindustries.com --password '...'
# Put a TLS-terminating reverse proxy in front before exposing it to the internet.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: arkhon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: arkhon_license
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkhon -d arkhon_license"]
      interval: 5s
      retries: 10
  license-server:
    build: { context: .., dockerfile: deploy/Dockerfile.license-server }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://arkhon:${POSTGRES_PASSWORD}@postgres:5432/arkhon_license
      ARKHON_ROOT_PUBLIC_KEY: ${ARKHON_ROOT_PUBLIC_KEY:?set ARKHON_ROOT_PUBLIC_KEY}
      ARKHON_ISSUING_KEY_FILE: /run/secrets/issuing.key
      ARKHON_ISSUING_CERT_FILE: /run/secrets/issuing.cert
      ARKHON_CEK_KEK_FILE: /run/secrets/cek-kek.hex
    volumes: [./secrets:/run/secrets:ro]
    ports: ["127.0.0.1:8443:8443"]
volumes:
  pgdata: {}
