[package]
name = "arkhon-license-server"
description = "Arkhon License Manager API (axum + sqlx + Postgres)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arkhon-crypto = { path = "../crates/arkhon-crypto" }
arkhon-license = { path = "../crates/arkhon-license" }
arkhon-tpm = { path = "../crates/arkhon-tpm" }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8.9"
base64 = "0.22"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "json"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
totp-rs = { version = "5", features = ["otpauth"] }
zeroize = "=1.9.1"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
