[package]
name = "arkhon-runtime"
description = "Arkhon Runtime: activation, in-memory model loading, local inference API, model router."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = ["fs", "mman", "process", "resource"] }

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
arkhon-crypto = { path = "../crates/arkhon-crypto" }
arkhon-license = { path = "../crates/arkhon-license" }
arkhon-tpm = { path = "../crates/arkhon-tpm" }
axum = "=0.8.9"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "rand_core", "zeroize", "fast"] }
hkdf = "=0.12.4"
p256 = { version = "=0.13.2", default-features = false, features = ["std", "arithmetic", "ecdh"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Maintained fork of serde_yaml (unsafe-libyaml-norway underneath); pinned exactly.
serde_norway = "=0.9.42"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
# Small blocking HTTP client: rustls (ring) with bundled webpki roots and no OpenSSL, so it builds
# the same way on Linux, Windows and macOS.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
zeroize = "=1.9.1"
# Held at 0.14.7 like the other crates (see crates/arkhon-tpm/Cargo.toml).
generic-array = "=0.14.7"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[features]
default = []
tpm = ["arkhon-tpm/tpm"]
