[package]
name = "arkhon-keygen"
description = "Offline key tooling: root key, issuing key + certificate, revocation lists."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arkhon-license = { path = "../../crates/arkhon-license" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "rand_core", "zeroize", "fast"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = "=1.9.1"
